[package]
name = "dxdb-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "dxdb storage traits (RxStorage / RxStorageInstance) and bulk-write categorisation"

[dependencies]
serde = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
dynosaur.workspace = true
dxdb-jsnum = { path = "../dxdb-jsnum" }
dxdb-jsstr = { path = "../dxdb-jsstr" }
dxdb-json = { path = "../dxdb-json" }

[dev-dependencies]
# The differential oracle test reads upstream's recorded output, so it needs a
# parser here rather than depending on the (leader-owned) feature flag.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The workspace's single typed reader for testdata/vectors. Using it instead of a local
# serde_json traversal keeps field names and nullability in one place.
dxdb-vectors = { path = "../dxdb-vectors" }

[features]
# `serde` derives on the wire-shaped types. Off by default so the core build
# stays small; the platform bindings turn it on at the boundary.
serde = ["dep:serde"]
