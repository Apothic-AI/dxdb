[package]
name = "dxdb-encryption"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "dxdb clean-room field encryption: versioned envelope over any storage"

[dependencies]
dxdb-storage = { path = "../../dxdb-storage" }
dxdb-json = { path = "../../dxdb-json" }
serde_json.workspace = true
thiserror.workspace = true
sha2 = { version = "0.11.1", default-features = false }
# No `getrandom` feature on either: a browser build has no OS entropy source, so
# random bytes come from an injected `EntropySource` (specs/encryption.md 5.2).
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.11.0", default-features = false, features = ["alloc", "aes"] }
futures.workspace = true

[dev-dependencies]
futures.workspace = true
