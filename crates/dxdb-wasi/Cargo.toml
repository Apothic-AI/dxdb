[package]
name = "dxdb-wasi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "dxdb WASI host binding: the conformance suite as a wasip1/wasip2 CLI, plus the WIT world for a component host"

[dependencies]
# The storage under test. `dxdb-filesystem` is the one storage that is real on
# this target today: redb over the WASI preopens. `dxdb-sqlite` also builds for
# wasip1/wasip2 (see its Cargo.toml) but is not wired into the suite yet.
dxdb-filesystem = { path = "../storages/dxdb-filesystem" }
dxdb-storage = { path = "../dxdb-storage" }
dxdb-json = { path = "../dxdb-json" }
# The real conformance suite. A normal dependency rather than dev-only: the CLI artifact
# that runs on Wasmtime and under Node has to contain the cases, so the suite is part of
# the shipped binary rather than a test-time concern.
dxdb-testkit = { path = "../dxdb-testkit" }
serde_json.workspace = true
futures.workspace = true

[lib]
# `cdylib` for the wasip2 component build, `rlib` for the CLI and for tests.
crate-type = ["rlib", "cdylib"]

# The suite's own tests need a scratch directory.
[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dxdb-conformance"
path = "src/main.rs"
