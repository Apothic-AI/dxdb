[package]
name = "dxdb-filesystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "dxdb filesystem storage: redb on native (clean-room, no upstream source read)"

[dependencies]
thiserror.workspace = true

# `experimental-multiprocess` is not optional here, and the name is a warning
# rather than decoration. redb's DEFAULT is `ConcurrencyMode::ExclusiveWriter`,
# which locks the whole file to one process: a second process's `open` fails with
# "Database already open. Cannot acquire lock." That cannot satisfy
# `multiInstance: true` at all, so `MultiWriter` is a requirement, not a tuning
# knob. The cost, measured: the feature pulls in `experimental-api-5`, which
# changes redb's read-only table API (`range` -> `range_owned(KeyRange)`). Our
# access goes through the `ReadableTable` trait and write transactions, which are
# unaffected. See `src/layout.rs` and `docs/lanes/m5-port-plan.md` 2.6.
redb = { version = "4.4.0", features = ["experimental-multiprocess"] }

# The storage trait and the verified pure helpers it needs. This crate became a real
# storage rather than a redb layout layer, so the trait is a hard dependency now, not
# a dev-only contract check.
dxdb-storage = { path = "../../dxdb-storage" }
# Selector matching, sorting and index strings. A storage consumes the query layer; it
# does not author encodings.
dxdb-query = { path = "../../dxdb-query" }
futures.workspace = true
# Stored documents are ordered JSON, and the trait's `DocumentData` is built from a
# `serde_json::Value`.
serde_json.workspace = true

[dev-dependencies]
# The shared conformance suite. A dev-dependency: the storage itself must not depend on
# the testkit, which is the oracle rather than a production concern.
dxdb-testkit = { path = "../../dxdb-testkit" }
# Only for the key-order tests: `tempfile` gives a directory that is cleaned up, which
# is the difference between a test suite and a pile of stray .redb files.
tempfile = "3"

# Contract checks against the published dxdb-storage surface.
dxdb-json = { path = "../../dxdb-json" }
serde_json.workspace = true

